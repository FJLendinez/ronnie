[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-ronnie"
version = "0.1.0"
description = "Django-style framework layer on top of FastHTML: settings, apps, commands, built-in security, contrib packages, cache, testing and tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Fran Lendinez" }]
keywords = ["fasthtml", "django", "framework", "htmx", "web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastlite>=0.1",
    "python-fasthtml>=0.14,<0.15",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
argon2 = ["argon2-cffi>=23.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.6",
    "fakeredis>=2.23",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
ronnie = "ronnie.core.management:main"

[project.entry-points.pytest11]
ronnie = "ronnie.testing.pytest_plugin"

[project.urls]
Homepage = "https://github.com/fjlendinez/ronnie"
Repository = "https://github.com/fjlendinez/ronnie"
Documentation = "https://fjlendinez.github.io/ronnie/"
Changelog = "https://github.com/fjlendinez/ronnie/blob/main/CHANGELOG.md"
Issues = "https://github.com/fjlendinez/ronnie/issues"
PyPI = "https://pypi.org/project/python-ronnie/"

[tool.hatch.build.targets.wheel]
packages = ["src/ronnie"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "site", "engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: shared contract suites run against every backend implementation",
]

[tool.coverage.run]
source = ["src/ronnie"]
branch = true

[tool.coverage.report]
omit = [
    "src/ronnie/global_settings.py",       # declarations only
    "src/ronnie/core/management/_templates.py",  # template literals only
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "SIM108", # ternary vs if/else is style taste
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008", "RUF012"]  # fixtures and fake request classes
"**/contrib/auth/views.py" = ["F811"]  # FastHTML verb-split pattern (get/post per path)
"**/contrib/admin/views.py" = ["F811"]  # same verb-split pattern per admin path

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ronnie"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["fasthtml.*", "fastcore.*", "fastlite.*", "fastsql.*", "redis.*", "argon2.*"]
ignore_missing_imports = true

# FastHTML view modules: untyped `req` params and verb-split get/post handlers
# are framework conventions (see engineering/fasthtml-0.14-spike.md).
[[tool.mypy.overrides]]
module = ["ronnie.contrib.auth.views", "ronnie.contrib.*.views"]
disable_error_code = ["no-untyped-def", "no-redef", "untyped-decorator", "assignment"]

# Admin views: same FastHTML conventions plus dictly typed body params.
[[tool.mypy.overrides]]
module = ["ronnie.contrib.admin.views", "ronnie.contrib.admin.site"]
disable_error_code = [
    "no-untyped-def",
    "no-redef",
    "untyped-decorator",
    "assignment",
    "type-arg",
    "misc",
    "no-untyped-call",
    "no-any-return",
    "arg-type",
]
